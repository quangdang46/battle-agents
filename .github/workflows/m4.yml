# The M4 milestone gate, and the pre-M4 load test that goes with it.
#
#   Section 27 M4: "share replay link with a logged-out user and they see the full
#   timeline." Section 40 puts the replay-render assertions here. Section 17.2:
#   "add load test simulating 100x20 ev/s before M4", repeated in §40 as "a pre-M4
#   gate, not M0".
#
# ## The load test is a STAGE of this pipeline, and the amendment is about that
#
# `load-test` runs the real harness through `pnpm load:events` and fails the build
# when the number of events allowed to become rows exceeds the ceiling in
# scripts/load-thresholds.ts, or when the harness did not reach the scenario rate.
# `load-threshold` is the stage beside it that runs the same harness twice with
# those thresholds set so the measurement cannot satisfy them, and asserts both go
# red — because a threshold nobody has watched fail is a number in a file, and
# ba-risk-gates-e74 was opened over exactly that.
#
# Why a stage rather than its own job: §17.2 asks for a pre-M4 gate and §40 says
# not an M0 one. A stage of the M4 milestone pipeline is a pre-M4 gate and is not
# M0, which is the whole of what those two lines ask for. Giving it a job of its
# own would split one milestone's definition of done across two CI statuses that
# could disagree — an M4 red with a green load test, or the reverse, with nothing
# saying which is authoritative.
#
# The stage set is scripts/stages-m4.manifest; the script is scripts/test-m4.sh;
# both are the repository's own, and this job runs that file as the compose
# `m4-test-runner` service — the same file, the same image and the same exit code
# a contributor gets from `bash scripts/test-m4.sh`.

name: m4

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: m4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-m4:
    name: pnpm test:m4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run the M4 milestone pipeline, load gate included
        run: |
          docker compose -f compose.yaml -f compose.test.yaml --profile test \
            run --rm --name m4-run m4-test-runner

      # The load numbers are the gate's evidence, not just its exit code: a red
      # ratio and a red rate say different things, and a report that only carries
      # "failed" sends whoever has to act back to a laptop to find out which.
      - name: Collect the per-stage markers and the load report
        if: always()
        run: |
          mkdir -p m4-stage-markers
          docker compose -f compose.yaml -f compose.test.yaml \
            cp m4-run:/workspace/.tmp/m4-stages/. m4-stage-markers
          docker compose -f compose.yaml -f compose.test.yaml \
            cp m4-run:/tmp/load-report.txt m4-stage-markers || true

      - name: Upload the per-stage markers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-stage-markers
          path: m4-stage-markers
          if-no-files-found: ignore

      - name: Tear down the test stack
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.test.yaml --profile test down --volumes --remove-orphans
